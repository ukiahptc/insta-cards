<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>insta-agent 인증 코드</title>
<style>body{font-family:-apple-system,sans-serif;padding:24px;background:#0b1220;color:#f8fafc}
h1{font-size:20px}textarea{width:100%;height:160px;font-size:14px;padding:10px;border-radius:8px;border:1px solid #334;background:#111a2e;color:#fff}
button{margin-top:12px;padding:14px 20px;font-size:18px;border:0;border-radius:8px;background:#facc15;color:#000;width:100%}
.ok{color:#4ade80}.err{color:#fb923c}</style>
<h1>인증 코드</h1>
<p id="msg">주소에서 코드를 읽는 중…</p>
<textarea id="code" readonly></textarea>
<button id="copy">코드 복사</button>
<script>
const p=new URLSearchParams(location.search);const c=p.get('code');const m=document.getElementById('msg');const t=document.getElementById('code');
if(c){t.value=c.replace(/#_$/,'');m.textContent='아래 코드를 복사해 Mac에서 get_token.mjs 에 넣으세요. (10분 안에 사용)';m.className='ok';}
else{m.textContent='코드가 없습니다. 오류: '+(p.get('error_description')||p.get('error')||'알 수 없음');m.className='err';}
document.getElementById('copy').onclick=async()=>{t.select();try{await navigator.clipboard.writeText(t.value);m.textContent='복사됨';}catch(e){document.execCommand('copy');m.textContent='복사됨';}};
</script>
